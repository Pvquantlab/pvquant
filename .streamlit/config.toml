# PVQuant Streamlit teması
# Değerler assets/styles.css :root ile hizalı (Anayasa Bölüm 2).
# Detaylı bileşen stilleri styles.css'ten enjekte edilir (tema.kur()).
[theme]
base = "light"
primaryColor = "#0F6E56"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#111827"
font = "sans serif"

[server]
runOnSave = true
maxUploadSize = 500