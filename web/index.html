    <script>(function(){try{var d=document.documentElement;if(location.pathname.indexOf("/yonetim")===0&&localStorage.getItem("pvq_platform_token")){d.dataset.yuz="platform";d.dataset.tema=localStorage.getItem("pvq_platform_tema")==="koyu"?"koyu":"acik";return;}if(!localStorage.getItem("pvq_token"))return;var k=localStorage.getItem("pvq_tema");if(k==="koyu"||k==="acik")d.dataset.tema=k;}catch(e){}})();</script>
