# PVQuant dağıtımı (v2.509; 28.11.2026 pvquant-deploy hesabı) — yalnız elle tetiklenir, yalnız main dalından.
# Neden: dağıtım bugüne dek geliştiricinin bilgisayarından ssh ile yapılıyordu; 30.10.2026'da port 22
# tek bir IP'ye kapandı ve v2.506 saatlerce bekledi. Bu iş GitHub runner'ından aynı komutu koşar.
# Sırlar depoda değil, GitHub gizli değişkenlerinde (docs/CI-DAGITIM.md):
#   DEPLOY_SSH_KEY     — yalnız dağıtım için üretilmiş özel anahtar (public kısmı sunucuda authorized_keys)
#   DEPLOY_HOST        — sunucu adresi
#   DEPLOY_KNOWN_HOSTS — `ssh-keyscan` çıktısı (StrictHostKeyChecking=yes ile sunucu kimliği sabitlenir)
# Otomatik tetikleme bilerek yok: önce CI yeşili (ci.yml), sonra bu iş elle.
name: Dağıtım

on:
  workflow_dispatch:
    inputs:
      onayli_sha:
        description: "Onaylanmış commit SHA (40 hex). Sunucu HEAD bu SHA olmazsa dağıtım DURUR; CI bu SHA'da yeşil olmalı."
        type: string
        required: true
      imajlar:
        description: "Yeniden derlenecek imajlar (api ve worker aynı Dockerfile'dan ayrı etiketlerdir)"
        type: choice
        default: "api worker web"
        options:
          - "api worker web"
          - "api web"
          - "web"

concurrency:
  group: dagitim-canli
  cancel-in-progress: false

jobs:
  deploy:
    name: "Canlıya dağıt (${{ inputs.imajlar }})"
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      IMAJLAR: ${{ inputs.imajlar }}
      ONAYLI_SHA: ${{ inputs.onayli_sha }}

    steps:
      # v2.669 sürüm güvenliği (28.11.2026): (1) SHA biçimi, (2) SHA main'in atası, (3) o SHA'da CI yeşil — hepsi dağıtımdan ÖNCE;
      # sunucuda `git pull` sonrası HEAD = onaylı SHA kapısı aşağıda. Beklenmeyen revizyon (onay ile dağıtım arasında main'e giren
      # commit) bu kapılarda durur. Geri dönüş: eski imaj etiketi `:onceki` build öncesi alınır.
      - name: Onaylı SHA biçimi, main atası ve CI durumu
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.onayli_sha }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::onayli_sha 40 hex olmalı"; exit 1; }
          durum=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${SHA}...main" --jq '.status')
          echo "main ile ilişki: $durum"
          [ "$durum" = "identical" ] || [ "$durum" = "ahead" ] || { echo "::error::SHA main'in atası değil ($durum)"; exit 1; }
          # ci.yml iki check-run üretir: "test" ve "web" — ikisi de success olmalı; eksik/bekleyen/kırmızı → dur (bayat onay da burada düşer)
          ozet=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs" --jq '[.check_runs[] | select(.name=="test" or .name=="web")] | map("\(.name)=\(.conclusion)") | sort | unique | join(",")')
          echo "CI check-run sonuçları: ${ozet:-<yok>}"
          [ "$ozet" = "test=success,web=success" ] || { echo "::error::CI bu SHA'da tam yeşil değil (${ozet:-yok})"; exit 1; }

      - name: Gizli değişkenler tanımlı mı
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          eksik=0
          for ad in DEPLOY_SSH_KEY DEPLOY_HOST DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!ad}" ]; then echo "::error::$ad gizli değişkeni tanımlı değil"; eksik=1; fi
          done
          [ "$eksik" -eq 0 ]

      - name: ssh anahtarı ve sunucu kimliği
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/dagitim && chmod 600 ~/.ssh/dagitim
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/dagitim > /dev/null   # anahtar biçimi doğru mu (değer yazdırılmaz)

      - name: "Sunucuda: git pull → PVQ_SURUM → docker compose build → up -d"
        id: sunucu
        run: |
          # 25.11.2026 (Faz 1 kalan #7): PVQ_SURUM dışa aktarılmazsa compose build.args boş kalır → X-PVQ-Yazilim ve koşu künyesi
          # yazilim_surumu boş (24.11 A1 hazırlık bulgusu). Damga sunucuda git describe'tan alınır ve doğrulama adımına taşınır.
          # v2.670 adayı (28.11.2026): en az ayrıcalık — root yerine `pvquant-deploy` (docker grubu yok, genel sudo yok); authorized_keys
          # `restrict,command=pvquant-dagit-sarmal` zorunlu komut; sunucudaki root'a ait sabit betik aynı sırayı koşar (pull → HEAD=SHA → :onceki → build → up).
          ssh -i ~/.ssh/dagitim -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=20 \
            "pvquant-deploy@${DEPLOY_HOST}" "dagit ${ONAYLI_SHA} ${IMAJLAR}" | tee /tmp/sunucu.log
          surum=$(sed -n 's/^PVQ_SURUM=//p' /tmp/sunucu.log | tail -1)
          [ -n "$surum" ] || { echo "::error::PVQ_SURUM sunucuda üretilemedi"; exit 1; }
          echo "surum=$surum" >> "$GITHUB_OUTPUT"

      - name: Canlı doğrulama (HTTPS 200 + sürüm damgası)
        env:
          BEKLENEN: ${{ steps.sunucu.outputs.surum }}
        run: |
          kod=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://pvquant.com/)
          echo "pvquant.com → HTTP $kod"
          [ "$kod" = "200" ]
          # api yeniden derlendiyse yayımlanan damga beklenenle aynı olmalı (eski imaj / boş damga yakalanır); yalnız web dağıtımında atlanır
          case " ${IMAJLAR} " in *" api "*)
            damga=$(curl -sI --max-time 20 https://pvquant.com/v1/healthz | tr -d '\r' | awk 'tolower($1)=="x-pvq-yazilim:"{print $2}')
            echo "X-PVQ-Yazilim: ${damga:-<boş>} (beklenen $BEKLENEN)"
            [ "$damga" = "$BEKLENEN" ] || { echo "::error::sürüm damgası uyuşmuyor"; exit 1; } ;;
          esac

      - name: Anahtarı sil
        if: always()
        run: rm -f ~/.ssh/dagitim
