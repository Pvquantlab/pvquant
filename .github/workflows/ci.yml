# PVQuant CI (v2.65) — anayasaya uygun: stil kapisi degil, kanit kapisi.
# Iskeletten gelen ruff/black/mypy sokuldu (proje disiplini regresyon+smoke).
# Her push'ta dunku "taze kurulum" durusmasinin otomatigi:
#   sifir ortam -> pip install -e .[dev] -> alembic upgrade head
#   -> TAM grup pytest (v2.157'den beri rapor_tutarlilik dahil) -> rapor md5 kalkani
name: CI

on:
  push:
    branches: [main, faz2-ui]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: pvquant
          POSTGRES_PASSWORD: pvquant_dev
          POSTGRES_DB: pvquant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pvquant"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Taze kurulum (v2.61 kaniti otomatiklesti)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Sema (alembic upgrade head — 0001..0005, RLS dahil)
        run: alembic upgrade head

      - name: Regresyon (tam grup — RLS uclusu servis DB'siyle kosar)
        run: pytest -q
      - name: Rapor kalkani (kanonik HTML md5 — v2.159)
        run: |
          cd reporting/html && rm -rf cikti && python3 uret.py > /dev/null
          echo "0cec038923665d2e0808dbaed7b3c6bb  cikti/PVQuant_Konya_GES_RAPOR_16sayfa.html" | md5sum -c -
