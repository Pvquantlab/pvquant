# docker-compose.yml
services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: pvquant
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pvquant_dev}
      POSTGRES_DB: pvquant
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pvquant"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
