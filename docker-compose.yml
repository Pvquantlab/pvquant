# docker-compose.yml
services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: pvquant
      POSTGRES_PASSWORD: ${DB_PASSWORD:?.env'de DB_PASSWORD tanimli olmali}
      POSTGRES_DB: pvquant
    # v2.342: veritabani YALNIZ yerel — genel IP'li sunucuda 5432 internete
    # acik olsaydi musteri verisi dogrudan hedef olurdu. Konteynerler
    # birbirine zaten ic agdan (db:5432) ulasir; bu port yalniz ana
    # makineden psql ile bakmak icin.
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped        # v2.63 (GUN 0): elle dokunmadan ayaga kalkis
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pvquant"]
      interval: 5s
      retries: 10

  worker:
    build: .
    environment:
      PVQ_DB_URL: postgresql+psycopg://pvquant:${DB_PASSWORD:?.env'de DB_PASSWORD tanimli olmali}@db:5432/pvquant
      PVQ_SENTRY_DSN: ${PVQ_SENTRY_DSN:-}
      PVQ_SMTP_HOST: ${PVQ_SMTP_HOST:-}
      PVQ_SMTP_PORT: ${PVQ_SMTP_PORT:-}
      PVQ_SMTP_USER: ${PVQ_SMTP_USER:-}
      PVQ_SMTP_PASS: ${PVQ_SMTP_PASS:-}
      PVQ_SMTP_FROM: ${PVQ_SMTP_FROM:-}
      PVQ_SMTP_TLS: ${PVQ_SMTP_TLS:-}
      PVQ_ALARM_TO: ${PVQ_ALARM_TO:-}
      PVQ_YEDEK_KAPALI: ${PVQ_YEDEK_KAPALI:-}   # v2.337: gece yedegini kapatmak icin
    volumes:
      - ./var:/app/var             # model artifact'leri (hyb_*.pkl) — imaja gomulmez, paylasilir
      - ./yedekler:/app/yedekler   # v2.337: gece veritabani yedekleri ana makinede tutulur
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped        # v2.63 (GUN 0)

  api:
    build: .                       # v2.72: worker ile ayni imaj, komut farkli
    # v2.321: tek işçi, sayfa açılışının ~20 eşzamanlı isteğini kuyrukluyordu
    # (ölçüldü: /summary tek başına 224ms, sayfa yükünde 1116ms). 4 süreç gerçek
    # paralellik verir (pandas GIL'i aşılır). Not: API-anahtarı hız sınırı süreç
    # başına sayar — 120/dk pratikte gevşer; sınır faturalama değil emniyettir.
    command: ["uvicorn", "apps.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
    environment:
      PVQ_DB_URL: postgresql+psycopg://pvquant:${DB_PASSWORD:?.env'de DB_PASSWORD tanimli olmali}@db:5432/pvquant
      PVQ_JWT_SECRET: ${PVQ_JWT_SECRET:-}
      PVQ_SENTRY_DSN: ${PVQ_SENTRY_DSN:-}
      # v2.334: başvuru teyidi/bildirimi api'den çıkar — worker'daki SMTP seti buraya da
      PVQ_SMTP_HOST: ${PVQ_SMTP_HOST:-}
      PVQ_SMTP_PORT: ${PVQ_SMTP_PORT:-}
      PVQ_SMTP_USER: ${PVQ_SMTP_USER:-}
      PVQ_SMTP_PASS: ${PVQ_SMTP_PASS:-}
      PVQ_SMTP_FROM: ${PVQ_SMTP_FROM:-}
      PVQ_SMTP_TLS: ${PVQ_SMTP_TLS:-}
      PVQ_BILDIRIM_EPOSTA: ${PVQ_BILDIRIM_EPOSTA:-}
      PVQ_DOMAIN: ${PVQ_DOMAIN:-localhost}   # v2.335: sıfırlama bağlantısı tabanı
    ports:
      # v2.342: yalniz 127.0.0.1 — yerel curl calisir, genel IP'li sunucuda
      # disaridan ERISILEMEZ (aksi halde API, Caddy/TLS baypas edilerek
      # duz HTTP uzerinden internete acilirdi).
      - "127.0.0.1:8000:8000"
    volumes:
      - ./var:/app/var             # v2.268: NWP önbelleği (var/nwp) ve model artifact'leri worker ile ortak
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped        # v2.72

  web:
    # v2.148: YENI arayuz — web/ SPA; kapidaki caddy / -> web:8080.
    # v2.160: eski Streamlit EMEKLI edildi (tarih git'te).
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped

  caddy:
    image: caddy:2
    environment:
      PVQ_DOMAIN: ${PVQ_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped        # v2.64

volumes:
  pgdata:
  caddy_data:
  caddy_config:
