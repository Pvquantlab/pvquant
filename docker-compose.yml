# docker-compose.yml
services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: pvquant
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pvquant_dev}
      POSTGRES_DB: pvquant
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped        # v2.63 (GUN 0): elle dokunmadan ayaga kalkis
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pvquant"]
      interval: 5s
      retries: 10

  worker:
    build: .
    environment:
      PVQ_DB_URL: postgresql+psycopg://pvquant:${DB_PASSWORD:-pvquant_dev}@db:5432/pvquant
      PVQ_SENTRY_DSN: ${PVQ_SENTRY_DSN:-}
      PVQ_SMTP_HOST: ${PVQ_SMTP_HOST:-}
      PVQ_SMTP_PORT: ${PVQ_SMTP_PORT:-}
      PVQ_SMTP_USER: ${PVQ_SMTP_USER:-}
      PVQ_SMTP_PASS: ${PVQ_SMTP_PASS:-}
      PVQ_SMTP_FROM: ${PVQ_SMTP_FROM:-}
      PVQ_ALARM_TO: ${PVQ_ALARM_TO:-}
    volumes:
      - ./var:/app/var             # model artifact'leri (hyb_*.pkl) — imaja gomulmez, paylasilir
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped        # v2.63 (GUN 0)

  api:
    build: .                       # v2.72: worker ile ayni imaj, komut farkli
    command: ["uvicorn", "apps.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      PVQ_DB_URL: postgresql+psycopg://pvquant:${DB_PASSWORD:-pvquant_dev}@db:5432/pvquant
      PVQ_JWT_SECRET: ${PVQ_JWT_SECRET:-}
      PVQ_SENTRY_DSN: ${PVQ_SENTRY_DSN:-}
    ports:
      - "8000:8000"                # yerel durusma: curl ile dogrudan
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped        # v2.72

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      PVQ_DB_URL: postgresql+psycopg://pvquant:${DB_PASSWORD:-pvquant_dev}@db:5432/pvquant
      PVQ_JWT_SECRET: ${PVQ_JWT_SECRET:-}
    volumes:
      - ./var:/app/var             # UI'dan kalibrasyon artifact yazar/okur
    ports:
      - "8502:8501"                # yerel durusma icin (host'taki 8501 ile catismasin)
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped        # v2.64

  caddy:
    image: caddy:2
    environment:
      PVQ_DOMAIN: ${PVQ_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    restart: unless-stopped        # v2.64

volumes:
  pgdata:
  caddy_data:
  caddy_config:
